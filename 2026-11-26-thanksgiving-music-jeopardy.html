<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Jeopardy</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>

:root{--board:#1F3D33;--board-dk:#17302A;--wood:#7A4A26;--wood-dk:#5A3418;--chalk:#F6F2E6;--dust:#B9C7BC;
--gold:#FFC93C;--coral:#FF6B6B;--teal:#3DD6C8;--pink:#FF7EB9;--lime:#A6E35A;--purple:#B18CFF;--orange:#FF9A3C;--lblue:#5CC8F0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a1a0e;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--chalk)}
body.hidecursor{cursor:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);container-type:size;background:var(--wood);overflow:hidden}
.board{position:absolute;inset:1.6cqw;background:var(--board);border:.25cqw solid var(--wood-dk);overflow:hidden}
.h{font-family:'Lilita One',sans-serif;font-weight:400}
.abs{position:absolute}
.center{text-align:center}
.kicker{font-family:'Lilita One';letter-spacing:.06em}
.hdr{position:absolute;left:3.6cqw;top:2.2cqw;font-family:'Lilita One';font-size:1.45cqw;letter-spacing:.05em}
.hdr:after{content:'';display:block;width:16cqw;height:.35cqw;background:currentColor;margin-top:.5cqw}
.count{position:absolute;right:3.4cqw;top:2.2cqw;font-family:'Lilita One';font-size:1.45cqw;color:var(--dust)}
.badge{position:absolute;left:4cqw;top:8.4cqw;width:11.6cqw;height:11.6cqw;display:flex;align-items:center;justify-content:center;
 font-family:'Lilita One';font-size:5cqw;color:var(--board-dk);
 clip-path:polygon(50% 0%,59% 16%,75% 7%,75% 25%,93% 25%,84% 41%,100% 50%,84% 59%,93% 75%,75% 75%,75% 93%,59% 84%,50% 100%,41% 84%,25% 93%,25% 75%,7% 75%,16% 59%,0% 50%,16% 41%,7% 25%,25% 25%,25% 7%,41% 16%)}
.qtext{position:absolute;left:18.5cqw;right:6cqw;top:8cqw;bottom:6cqw;display:flex;align-items:center;font-family:'Lilita One';font-size:4.6cqw;line-height:1.18}
.has-timer .qtext{right:24cqw}
.has-timer .grid{right:23cqw}
.card{position:absolute;left:18.5cqw;right:6cqw;top:27cqw;height:20cqw;background:var(--board-dk);border:.3cqw dashed;border-radius:2cqw;padding:2.4cqw 3.4cqw}
.card .lab{font-family:'Lilita One';font-size:1.6cqw}
.card .ans{font-family:'Lilita One';font-size:4.6cqw;margin-top:1cqw;line-height:1.1}
.smallq{position:absolute;left:18.5cqw;right:6cqw;top:9cqw;height:15cqw;display:flex;align-items:center;font-size:2.3cqw;color:var(--dust)}
.big{font-family:'Lilita One';font-size:7.5cqw;line-height:1.05}
.sub{font-size:2.3cqw;color:var(--dust);margin-top:2cqw;white-space:pre-line}
.mid{position:absolute;left:6cqw;right:6cqw;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rules{position:absolute;left:5cqw;right:5cqw;top:9cqw}
.rules h2{font-family:'Lilita One';font-weight:400;font-size:4.6cqw;margin:0 0 2.6cqw}
.rules li{list-style:none;font-size:2.35cqw;margin:0 0 1.6cqw;display:flex;gap:1.6cqw;align-items:center}
.rules ul{padding:0;margin:0}
.star{width:2.6cqw;height:2.6cqw;flex:none;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.flagwrap{position:absolute;background:var(--chalk);padding:.9cqw;transform:rotate(-1.5deg)}
.flagwrap img{display:block;height:100%;width:auto}
.grid{position:absolute;left:5cqw;right:5cqw;top:7.5cqw;bottom:2.5cqw;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1cqw}
.cell{background:var(--board-dk);border:.3cqw solid;border-radius:1.4cqw;padding:1.2cqw 1.6cqw;display:flex;flex-direction:column;justify-content:space-between}
.cell .cat{font-family:'Lilita One';font-size:1.75cqw}
.cell .ex{font-size:1.8cqw;color:var(--chalk)}
.cell .line{height:.25cqw;background:var(--dust);opacity:.6}
.pill{position:absolute;border-radius:50%}
.order{position:absolute;left:5cqw;right:5cqw;top:9cqw;display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw 2.4cqw}
.order div{border:.25cqw solid;border-radius:1.2cqw;background:var(--board-dk);padding:1cqw 2cqw}
.order b{display:block;font-family:'Lilita One';font-weight:400;font-size:1.3cqw}
.order span{font-size:2.1cqw;font-weight:700}
.conf{position:absolute;pointer-events:none}
/* timer */
#timer{position:absolute;right:4.5cqw;bottom:5cqw;width:17cqw;height:17cqw;display:none}
#timer.big{right:auto;left:50%;transform:translateX(-50%);bottom:4cqw}
#timer svg{width:100%;height:100%}
#timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Lilita One';font-size:6cqw}
#timesup{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:'Lilita One';font-size:11cqw;color:var(--coral);background:rgba(23,48,42,.82);z-index:20}
/* buzzer */
#buzz{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center}
#buzz .who{font-family:'Lilita One';font-size:12cqw;line-height:1;text-shadow:0 .4cqw 0 rgba(0,0,0,.25)}
#buzz .first{font-family:'Lilita One';font-size:2.4cqw;letter-spacing:.1em;opacity:.85}
#buzz .next{font-size:2.4cqw;margin-top:2cqw;font-weight:700}
#buzz .cd{font-family:'Lilita One';font-size:6cqw;margin-top:1.4cqw}
/* host status */
#status{position:absolute;left:2cqw;bottom:.35cqw;font-size:1cqw;color:#e9d6c2;opacity:.85;z-index:40;white-space:nowrap}
#status.off{display:none}
/* edit panel */
#edit{position:fixed;inset:0;background:#12261f;color:var(--chalk);z-index:100;display:none;overflow:auto;font-size:14px;cursor:auto}
#edit .in{max-width:1200px;margin:0 auto;padding:20px 24px 80px}
#edit h1{font-family:'Lilita One';font-weight:400;font-size:30px;margin:0 0 4px}
#edit h3{font-family:'Lilita One';font-weight:400;font-size:20px;margin:26px 0 8px;color:var(--gold)}
#edit .muted{color:var(--dust)}
#edit button{font-family:'Lilita One';font-size:15px;padding:8px 14px;border-radius:8px;border:0;cursor:pointer;background:var(--gold);color:var(--board-dk);margin:2px 4px 2px 0}
#edit button.g{background:#1ED760}
#edit button.ghost{background:transparent;color:var(--chalk);border:1px solid var(--dust)}
#edit input,#edit select{background:#0b1c16;border:1px solid #3c6b5b;color:var(--chalk);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:14px}
#edit table{width:100%;border-collapse:collapse}
#edit td,#edit th{border-bottom:1px solid #24453a;padding:6px 6px;vertical-align:top;text-align:left}
#edit th{font-size:12px;color:var(--dust);font-weight:400;position:sticky;top:0;background:#12261f}
#edit tr.sec td{background:#1a3a30;font-family:'Lilita One';font-size:16px;color:var(--gold)}
#edit .song{font-weight:700}
#edit .res div{padding:4px 6px;border-radius:6px;cursor:pointer}
#edit .res div:hover{background:#24453a}
#edit .close{position:sticky;top:0;float:right;z-index:3}
#edit .keys span{display:inline-block;margin-right:14px}
#edit .team{display:inline-flex;align-items:center;gap:8px;margin:4px 16px 4px 0}
#edit .dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid #000}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0b1c16;border:1px solid var(--dust);color:var(--chalk);padding:10px 16px;border-radius:10px;z-index:200;display:none;font-size:15px}
.jump{cursor:pointer}.jump:hover{color:#FFC93C;text-decoration:underline}tr.cur td{background:rgba(255,201,60,.08)}.here{color:#FFC93C;font-size:12px;white-space:nowrap}

/* ---- jeopardy ---- */
.jtitle{position:absolute;left:0;right:0;top:1.1cqw;text-align:center;font-family:'Lilita One';font-size:2.1cqw;letter-spacing:.08em;color:var(--gold)}
.jgrid{position:absolute;left:1.8cqw;right:1.8cqw;top:4.6cqw;bottom:10.4cqw;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1.25fr repeat(5,1fr);gap:.7cqw}
.jh{display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Lilita One';font-size:1.75cqw;line-height:1.05;color:var(--board-dk);border-radius:1cqw;padding:.4cqw .8cqw}
.jt{display:flex;align-items:center;justify-content:center;font-family:'Lilita One';font-size:3.6cqw;color:var(--gold);background:var(--board-dk);border:.25cqw solid #2f5a4b;border-radius:1cqw;cursor:pointer;text-shadow:0 .25cqw 0 rgba(0,0,0,.35);transition:transform .12s}
.jt:hover{transform:scale(1.04);border-color:var(--gold)}
.jt.used{cursor:default;background:transparent;border-style:dashed;border-color:#2a4d41;color:transparent;text-shadow:none}
.jt.used:hover{transform:none}
.jscores{position:absolute;left:1.8cqw;right:1.8cqw;bottom:1.2cqw;height:8cqw;display:grid;grid-template-columns:repeat(5,1fr);gap:.8cqw}
.js{border-radius:1cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.js .n{font-family:'Lilita One';font-size:1.3cqw;letter-spacing:.05em;opacity:.9}
.js .p{font-family:'Lilita One';font-size:3.4cqw;line-height:1}
.js .adj{position:absolute;top:.4cqw;bottom:.4cqw;width:2.4cqw;border:0;border-radius:.6cqw;background:rgba(0,0,0,.18);color:inherit;font-family:'Lilita One';font-size:1.8cqw;cursor:pointer;opacity:0;transition:opacity .15s}
.js:hover .adj{opacity:1}
.js .adj.m{left:.4cqw}.js .adj.pl{right:.4cqw}
.eq{display:flex;gap:1cqw;align-items:flex-end;height:9cqw;margin:2.4cqw 0 1cqw}
.eq i{display:block;width:1.8cqw;border-radius:.4cqw;animation:eq 1s ease-in-out infinite}
.eq.off i{animation-play-state:paused;opacity:.35}
@keyframes eq{0%,100%{height:2cqw}50%{height:9cqw}}
.dd{display:inline-block;background:var(--gold);color:var(--board-dk);font-family:'Lilita One';font-size:2.4cqw;padding:.5cqw 2cqw;border-radius:1cqw;margin-bottom:1.4cqw;transform:rotate(-2deg)}
.chip{display:inline-flex;align-items:center;gap:1cqw;font-family:'Lilita One';font-size:2.6cqw;padding:.8cqw 2.4cqw;border-radius:5cqw;margin-top:2.4cqw}
.hint{position:absolute;left:0;right:0;bottom:2cqw;text-align:center;font-size:1.5cqw;color:var(--dust)}
.ddteams{display:flex;gap:1.4cqw;margin-top:2.6cqw}.ddteams div{font-family:'Lilita One';font-size:2.2cqw;padding:1.2cqw 2.2cqw;border-radius:1.2cqw;cursor:pointer;border:.3cqw solid transparent}.ddteams div:hover{border-color:var(--chalk)}
.wager{font-family:'Lilita One';font-size:5cqw;width:22cqw;text-align:center;background:var(--board-dk);color:var(--gold);border:.35cqw solid var(--gold);border-radius:1.4cqw;padding:.6cqw;margin-top:2cqw;outline:none}
.gobtn{font-family:'Lilita One';font-size:2.2cqw;background:var(--gold);color:var(--board-dk);border:0;border-radius:1.2cqw;padding:1cqw 3cqw;margin-top:2cqw;cursor:pointer}
.podium{display:flex;flex-direction:column;gap:1cqw;margin-top:2.6cqw;width:60cqw}
.podium div{display:flex;justify-content:space-between;align-items:center;border-radius:1.2cqw;padding:1cqw 2.4cqw;font-family:'Lilita One';font-size:2.8cqw}
#edit tr.cat td{background:#1a3a30}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div class="board" id="board"></div>
  <div id="buzz"><div class="first">FIRST TO BUZZ</div><div class="who" id="bwho"></div><div class="cd" id="bcd"></div><div class="next" id="bnext"></div></div>
  <div id="status"></div>
</div></div>
<div id="edit"><div class="in" id="editIn"></div></div>
<div id="toast"></div>

<script>
const DATA = {"title": "Thanksgiving Music Jeopardy", "cats": [{"name": "Made in the USA", "task": "Name the song!", "color": "#FF6B6B", "tiles": [{"q": "Born in the U.S.A. Bruce Springsteen", "ans": "Born in the U.S.A.", "sub": "Bruce Springsteen", "note": "", "dbl": false}, {"q": "Party in the U.S.A. Miley Cyrus", "ans": "Party in the U.S.A.", "sub": "Miley Cyrus", "note": "", "dbl": false}, {"q": "Sweet Home Alabama Lynyrd Skynyrd", "ans": "Sweet Home Alabama", "sub": "Lynyrd Skynyrd", "note": "", "dbl": false}, {"q": "American Pie Don McLean", "ans": "American Pie", "sub": "Don McLean", "note": "", "dbl": false}, {"q": "Free Fallin' Tom Petty", "ans": "Free Fallin'", "sub": "Tom Petty", "note": "", "dbl": false}]}, {"name": "Thanksgiving Dinner", "task": "Name the song! (Hint: there's food in the title)", "color": "#FF9A3C", "tiles": [{"q": "Watermelon Sugar Harry Styles", "ans": "Watermelon Sugar", "sub": "Harry Styles", "note": "", "dbl": false}, {"q": "Cake by the Ocean DNCE", "ans": "Cake by the Ocean", "sub": "DNCE", "note": "", "dbl": false}, {"q": "Peaches Justin Bieber", "ans": "Peaches", "sub": "Justin Bieber", "note": "", "dbl": false}, {"q": "Sugar, Sugar The Archies", "ans": "Sugar, Sugar", "sub": "The Archies", "note": "", "dbl": false}, {"q": "Blueberry Hill Fats Domino", "ans": "Blueberry Hill", "sub": "Fats Domino", "note": "", "dbl": false}]}, {"name": "Who Sings It?", "task": "Name the artist!", "color": "#3DD6C8", "tiles": [{"q": "Single Ladies (Put a Ring on It) Beyoncé", "ans": "Beyoncé", "sub": "Single Ladies (Put a Ring on It)", "note": "", "dbl": false}, {"q": "Uptown Funk Mark Ronson", "ans": "Mark Ronson ft. Bruno Mars", "sub": "Uptown Funk", "note": "Mark Ronson or Bruno Mars both count", "dbl": false}, {"q": "Jolene Dolly Parton", "ans": "Dolly Parton", "sub": "Jolene", "note": "", "dbl": true}, {"q": "Hotel California Eagles", "ans": "Eagles", "sub": "Hotel California", "note": "", "dbl": false}, {"q": "Take Me Home, Country Roads John Denver", "ans": "John Denver", "sub": "Take Me Home, Country Roads", "note": "", "dbl": false}]}, {"name": "Turkey Time Machine", "task": "What year did this song come out? Within 2 years counts!", "color": "#B18CFF", "tiles": [{"q": "Old Town Road Lil Nas X", "ans": "2019", "sub": "Old Town Road – Lil Nas X", "note": "", "dbl": false}, {"q": "Hey Ya! OutKast", "ans": "2003", "sub": "Hey Ya! – OutKast", "note": "", "dbl": false}, {"q": "Smells Like Teen Spirit Nirvana", "ans": "1991", "sub": "Smells Like Teen Spirit – Nirvana", "note": "", "dbl": false}, {"q": "I Wanna Dance with Somebody Whitney Houston", "ans": "1987", "sub": "I Wanna Dance with Somebody – Whitney Houston", "note": "", "dbl": false}, {"q": "Respect Aretha Franklin", "ans": "1967", "sub": "Respect – Aretha Franklin", "note": "", "dbl": false}]}, {"name": "Finish the Line", "task": "Buzz in and sing the next line!", "color": "#A6E35A", "tiles": [{"q": "Don't Stop Believin' Journey", "ans": "Don't Stop Believin'", "sub": "Journey", "note": "Listen on to check the line!", "dbl": false}, {"q": "I Will Survive Gloria Gaynor", "ans": "I Will Survive", "sub": "Gloria Gaynor", "note": "Listen on to check the line!", "dbl": false}, {"q": "Bye Bye Bye NSYNC", "ans": "Bye Bye Bye", "sub": "NSYNC", "note": "Listen on to check the line!", "dbl": false}, {"q": "...Baby One More Time Britney Spears", "ans": "...Baby One More Time", "sub": "Britney Spears", "note": "Listen on to check the line!", "dbl": false}, {"q": "Total Eclipse of the Heart Bonnie Tyler", "ans": "Total Eclipse of the Heart", "sub": "Bonnie Tyler", "note": "Listen on to check the line!", "dbl": false}]}]};
/* ---------- storage ---------- */
const S = {
  get(k, d) { try { const v = localStorage.getItem('pq_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pq_' + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const FILE = (location.pathname.split('/').pop() || '').replace(/\.html$/, '');
const QUIZ = (!FILE || FILE === 'index') ? '' : FILE;          // '' = the main quiz
const QK = k => QUIZ ? k + '__' + QUIZ : k;                       // per-quiz storage key
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function prettyQuiz(f) {
  if (!f) return 'Main quiz (current)';
  const m = f.match(/^(\d{4})-(\d{2})-(\d{2})-?(.*)$/);
  const rest = (m ? m[4] : f).replace(/-/g, ' ').replace(/\bpub quiz (\d+)/i, 'Pub Quiz #$1').trim();
  const t = rest ? rest.charAt(0).toUpperCase() + rest.slice(1) : 'Quiz';
  return m ? `${+m[3]} ${MON[+m[2] - 1]} ${m[1]} · ${t}` : t;
}
const QUIZ_NAME = prettyQuiz(QUIZ);
const BASE = location.hostname.endsWith('github.io') ? '/quiz/' : location.pathname.replace(/[^/]*$/, '');
async function quizList() {
  let list = S.get('quizList', []);
  try {
    const r = await fetch('https://api.github.com/repos/vesoma-quiz/quiz/contents/', { cache: 'no-store' });
    if (r.ok) { list = (await r.json()).map(f => f.name).filter(n => /\.html$/.test(n) && n !== 'index.html').map(n => n.replace(/\.html$/, '')).sort().reverse(); S.set('quizList', list); }
  } catch (e) {}
  if (QUIZ && !list.includes(QUIZ)) list.unshift(QUIZ);
  return list;
}
function goQuiz(f) { location.href = BASE + (f ? f + '.html' : ''); }
const C = {gold:'#FFC93C',coral:'#FF6B6B',teal:'#3DD6C8',pink:'#FF7EB9',lime:'#A6E35A',purple:'#B18CFF',orange:'#FF9A3C',lblue:'#5CC8F0',dust:'#B9C7BC',chalk:'#F6F2E6',dk:'#17302A'};
const PARTY = [C.gold,C.coral,C.teal,C.pink,C.lime,C.purple,C.orange];
const RC = [C.gold,C.pink,C.lime,C.teal,C.orange,C.coral,C.purple,C.lblue];
const NAMES = ['General Knowledge','Finish the Lyrics','60-Second Drawing','The Letter Game','What Do I Mean?','Flags & Capitals','What Show Am I?','Double It & Pass It On'];
const DEFAULT_TEAMS = [
  {name:'Dark blue', color:'#1B3EA8', key:'1'}, {name:'Green', color:'#3FB54A', key:'2'},
  {name:'Red', color:'#E63B3B', key:'3'}, {name:'Yellow', color:'#F5C518', key:'4'}, {name:'Light blue', color:'#5CC8F0', key:'5'}];
let TEAMS = S.get('teams', DEFAULT_TEAMS);
function toast(t, ms = 2500) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = 'none', ms); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- decorations ---------- */
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const EDGE = [[1,92,98,7],[93,14,6,76],[1,40,4,50]];
const WIDE = EDGE.concat([[72,16,26,16],[80,74,18,15],[2,15,12,12]]);
function confetti(n, zones, big) {
  let h = '';
  for (let i = 0; i < n; i++) {
    const z = zones[Math.floor(rnd() * zones.length)], k = rnd(), s = (0.55 + rnd() * 0.75) * (big ? 1.35 : 1);
    const x = z[0] + rnd() * z[2], y = z[1] + rnd() * z[3], col = PARTY[Math.floor(rnd() * 7)], r = Math.floor(rnd() * 360);
    let st = `left:${x}%;top:${y}%;background:${col};transform:rotate(${r}deg);`;
    if (k < .5) st += `width:${s}cqw;height:${s * .45}cqw;`;
    else if (k < .8) st += `width:${s * .7}cqw;height:${s * .7}cqw;border-radius:50%;`;
    else st += `width:${s * .8}cqw;height:${s * .8}cqw;clip-path:polygon(50% 0,100% 100%,0 100%);`;
    h += `<div class="conf" style="${st}"></div>`;
  }
  return h;
}
function bunting() {
  let h = '<svg class="abs" style="left:0;top:0;width:100%;height:12cqw" viewBox="0 0 1000 90" preserveAspectRatio="none"><path d="M0 8 Q500 60 1000 8" fill="none" stroke="#F6F2E6" stroke-width="2"/>';
  for (let i = 0; i < 16; i++) { const cx = (i + .5) * 62.5, t = cx / 1000, cy = 8 + 52 * 4 * t * (1 - t) / 2 * 1.0; const y = 8 + (1 - Math.pow(2 * t - 1, 2)) * 26;
    h += `<polygon points="${cx - 22},${y} ${cx + 22},${y} ${cx},${y + 46}" fill="${PARTY[i % 7]}"/>`; }
  return h + '</svg>';
}

  ding: {name: 'Ding ding', play() { tone(1320, 0, .5, 'sine', .5); tone(1320, .25, .7, 'sine', .5); tone(2640, 0, .3, 'sine', .15); }},
  boing: {name: 'Boing', play() { const a = ac(), o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(140, a.currentTime); o.frequency.exponentialRampToValueAtTime(900, a.currentTime + .25); o.frequency.exponentialRampToValueAtTime(220, a.currentTime + .6); g.gain.setValueAtTime(.6, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .8); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .85); }},

function openTile(c, r) {

}

function ddGo() {
  const w = $('wager'), v = Math.round(Number(w && w.value));
  if (!w || w.value === '' || isNaN(v) || v < 0) return toast('Type the bet first (a number)');
  if (v > ddMax()) return toast('Too high! Team ' + TEAMS[G.ddTeam].name + ' can bet up to ' + ddMax());
  G.dd = true; G.wager = v; G.buzz = G.ddTeam; G.screen = 'clue'; render();
  const t = tc(G.c, G.r); if (t.song) SP.play(t.song, toMs(t.start), Number(t.playFor) || 0).then(render); else toast('No song on this square yet. Press E to add one.', 4000);
}
function buzz(i) {

  if (G.screen !== 'clue' || G.dd || G.buzz != null || G.locked.includes(i)) return;
  G.buzz = i; teamSound(i); if (SP.playing) SP.pause().then(render);
  const t = TEAMS[i]; $('buzz').style.background = t.color; $('buzz').style.color = txtColor(t.color);
  $('bwho').textContent = 'Team ' + t.name + '!'; $('bcd').textContent = ''; $('bnext').textContent = 'Host: Y = right · N = wrong'; $('buzz').style.display = 'flex';
}
function pts() { return G.dd ? G.wager : VAL(G.r); }
function right() {
  if (G.buzz == null) return;
  const p = pts(); ST.scores[G.buzz] += p; G.winner = {t: G.buzz, pts: p}; G.buzz = null; $('buzz').style.display = 'none';
  PRESETS.ding.play(); reveal();
}
function wrong() {
  if (G.buzz == null) return;
  const i = G.buzz, p = pts(); ST.scores[i] -= p; saveST(); G.locked.push(i); G.buzz = null; $('buzz').style.display = 'none';
  SND.end(); toast('Team ' + TEAMS[i].name + ' −' + p);

  resume(); render();
}

function reveal() { ST.used[G.c + '-' + G.r] = true; saveST(); G.screen = 'answer'; $('buzz').style.display = 'none'; render(); resume(); }
function toBoard() { $('buzz').style.display = 'none'; if (SP.playing) SP.pause(); G = {screen: left() ? 'board' : 'final'}; if (G.screen === 'final') PRESETS.fanfare.play(); render(); }
function adj(i, d) { ST.scores[i] += d; saveST(); render(); }
function toMs(s) { const m = String(s || '').trim().match(/^(\d+):(\d{1,2})$/); if (m) return (+m[1] * 60 + +m[2]) * 1000; const n = Number(s); return isNaN(n) ? 0 : n * 1000; }

document.addEventListener('keydown', e => {
  if ($('edit').style.display === 'block') { if (e.key === 'Escape' && !e.target.matches('input')) closeEdit(); if (B.learn !== undefined) learnKey(e); return; }
  ac();
  if (e.target.matches && e.target.matches('input')) { if (e.key === 'Escape') toBoard(); return; }
  const k = e.key, K = k.toLowerCase();
  const t = TEAMS.findIndex(x => x.key === k);
  if (t >= 0) { e.preventDefault(); return buzz(t); }
  if (K === 'y') right();
  else if (K === 'n') wrong();
  else if (k === 'ArrowRight' || k === 'PageDown' || k === 'Enter') {
    e.preventDefault();
    if (G.screen === 'dd') { if (G.ddTeam != null) ddGo(); }
    else if (G.screen === 'clue') { if (G.buzz != null) { G.buzz = null; } reveal(); }
    else if (G.screen === 'answer') toBoard();
    else if (G.screen === 'board' && !left()) toBoard();
  }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); if (G.screen !== 'board') toBoard(); }
  else if (k === ' ') { e.preventDefault(); if (G.buzz != null && !G.dd) { G.buzz = null; $('buzz').style.display = 'none'; resume(); } }
  else if (K === 'p') SP.toggle().then(render);

  else if (K === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
  else if (K === 'h') $('status').classList.toggle('off');
  else if (K === 'e') openEdit();
  else if (k === 'F5' || K === 'b' || k === '.' || k === 'Escape') e.preventDefault();
});

const B = {learn: undefined};
function openEdit() { $('edit').style.display = 'block'; drawEdit(); }
function closeEdit() { $('edit').style.display = 'none'; B.learn = undefined; render(); }
function learnKey(e) { if (e.key === 'Escape') { B.learn = undefined; drawEdit(); return; } e.preventDefault(); TEAMS[B.learn].key = e.key; S.set('teams', TEAMS); toast(TEAMS[B.learn].name + ' = key "' + e.key + '"'); B.learn = undefined; drawEdit(); }
function setTile(c, r, patch) { setCfg('t' + c + '-' + r, patch); }
function setUsed(c, r, v) { ST.used[c + '-' + r] = v; saveST(); }
async function drawEdit() {
  let h = `<button class="close ghost" onclick="closeEdit()">Close (Esc)</button><h1>Edit mode · Music Jeopardy</h1><div class="muted">Songs, answers and scores. Everything saves by itself on this laptop.</div><div style="margin-top:8px">Quiz: <select onchange="goQuiz(this.value)"><option value="">${esc(prettyQuiz(''))}</option>${(await quizList()).map(f => `<option value="${esc(f)}" ${f === QUIZ ? 'selected' : ''}>${esc(prettyQuiz(f))}</option>`).join('')}</select></div>`;
  h += `<h3>Spotify</h3>`;
  if (SP.connected()) {
    let devs = []; try { devs = await SP.devices(); } catch (e) {}
    if (devs.length && !devs.some(d => d.id === SP.device)) { const c = devs.find(d => d.type === 'Computer') || devs[0]; SP.device = c.id; S.set('device', c.id); }
    h += `<span style="color:#A6E35A">✓ Connected</span> &nbsp; Play music on: <select id="devSel">${devs.map(d => `<option value="${d.id}" ${d.id === SP.device ? 'selected' : ''}>${esc(d.name)} (${d.type})</option>`).join('') || '<option>Open Spotify on the MacBook, then reopen edit mode</option>'}</select>
      &nbsp; Music volume <input id="vol" type="number" min="5" max="100" value="${SP.volume}" style="width:70px">%
      <div style="margin-top:8px"><button class="g" onclick="autoFill()">Auto-fill all songs</button> <span class="muted">Finds all 25 songs on Spotify, for every empty square. Do this once.</span></div>`;
  } else h += `<button class="g" onclick="SP.login()">Connect Spotify</button> <span class="muted">Log in with your Premium account.</span>`;
  h += `<h3>Teams and scores</h3><table style="width:auto">${TEAMS.map((t, i) => `<tr><td><span class="team" style="margin:0"><span class="dot" style="background:${t.color}"></span><b>${esc(t.name)}</b></span></td>
    <td>${B.learn === i ? '<b style="color:#FFC93C">Press the buzzer now…</b>' : 'Key "' + esc(t.key) + '"'} <button class="ghost" onclick="B.learn=${i};drawEdit()">Change</button></td>
    <td>Sound: <select onchange="TEAMS[${i}].sound=this.value;S.set('teams',TEAMS)">${Object.entries(PRESETS).map(([k, p]) => `<option value="${k}" ${(t.sound || 'buzzer') === k ? 'selected' : ''}>${p.name}</option>`).join('')}<option value="custom" ${t.sound === 'custom' ? 'selected' : ''}>My recording</option></select> <button class="ghost" onclick="ac();teamSound(${i})">▶ Test</button></td>
    <td>Score: <input type="number" step="100" style="width:90px" value="${ST.scores[i]}" onchange="ST.scores[${i}]=Number(this.value)||0;saveST()"></td></tr>`).join('')}</table>
    <div class="muted">Team sounds and recordings are the same as in the pub quiz (record new ones there).</div>
    <div style="margin-top:8px"><button onclick="if(confirm('Start a new game? All scores go to 0 and every square opens again.')){ST={used:{},scores:TEAMS.map(()=>0)};saveST();drawEdit()}">New game (reset scores and board)</button></div>`;
  h += `<h3>Keys during the game</h3><div class="keys muted"><span>Click a square to open it</span><span>1–5 buzzers</span><span>Y right (adds points)</span><span>N wrong (takes points, others can buzz)</span><span>→ show answer / back to board</span><span>← back to board (square stays open)</span><span>Space cancel a buzz</span><span>Daily Double: click the team (or it buzzes), type the bet, Enter</span><span>P pause / play music</span><span>W final scores</span><span>F full screen</span><span>E edit mode</span></div>
    <div class="muted" style="margin-top:6px">To fix a score on the board: move the mouse over a team's score and click − or +.</div>`;
  h += `<h3>The board</h3><div class="muted" style="margin-bottom:8px">Title on the board: <input style="width:320px" value="${esc(CFG.title || DATA.title)}" onchange="CFG.title=this.value;S.set(QK('jcfg'),CFG)"></div>
    <table><tr><th>Points</th><th>Song</th><th>Start at</th><th>Play for (s)</th><th>Answer (big)</th><th>Small line under it</th><th>Daily Double</th><th>Played</th></tr>`;
  for (let c = 0; c < NC; c++) {
    const k = cc(c);
    h += `<tr class="sec"><td colspan="8"><span style="color:${DATA.cats[c].color}">■</span> Category: <input style="width:220px" value="${esc(k.name)}" onchange="setCfg('c${c}',{name:this.value})"> &nbsp; Task on screen: <input style="width:420px" value="${esc(k.task)}" onchange="setCfg('c${c}',{task:this.value})"></td></tr>`;
    for (let r = 0; r < NR; r++) {
      const t = tc(c, r), id = c + '-' + r;
      h += `<tr><td class="song">${VAL(r)}</td>
        <td style="min-width:250px">${t.song ? `<div class="song">♪ ${esc(t.songName || t.song)}</div><button class="ghost" onclick="setTile(${c},${r},{song:'',songName:''});drawEdit()">Remove</button>
          <div style="margin-top:4px">${MS.c === c && MS.r === r ? `<button onclick="markStop(${c},${r})">⏹ Stop here</button> <span style="color:#FFC93C">Listening… click Stop here right before the line</span>` : `<button class="ghost" onclick="listen(${c},${r})">▶ Listen</button>${t.playFor ? ` <button class="ghost" onclick="testClip(${c},${r})">▶ Test the clip</button>` : ''}`}</div>` : ''}
          <div><input placeholder="Search Spotify or paste song link" style="width:220px" onkeydown="if(event.key==='Enter')findSong(${c},${r},this.value)"> <button class="ghost" onclick="findSong(${c},${r},this.previousElementSibling.value)">Find</button></div><div class="res" id="res-${id}"></div></td>
        <td><input style="width:60px" value="${esc(t.start)}" onchange="setTile(${c},${r},{start:this.value})"></td>
        <td><input style="width:54px" value="${esc(t.playFor)}" placeholder="all" onchange="setTile(${c},${r},{playFor:this.value})"></td>
        <td><input style="width:200px" value="${esc(t.ans)}" onchange="setTile(${c},${r},{ans:this.value})"></td>
        <td><input style="width:200px" value="${esc(t.sub)}" onchange="setTile(${c},${r},{sub:this.value})"></td>
        <td><input type="checkbox" ${t.dbl ? 'checked' : ''} onchange="setTile(${c},${r},{dbl:this.checked})"></td>
        <td><input type="checkbox" ${used(c, r) ? 'checked' : ''} onchange="setUsed(${c},${r},this.checked)"></td></tr>
        <tr><td></td><td colspan="7" style="padding-top:0">Text on screen while the song plays: <input style="width:640px" placeholder="optional – e.g. the last line they hear before the music stops" value="${esc(t.clue || '')}" onchange="setTile(${c},${r},{clue:this.value})"></td></tr>`;
    }
  }
  h += `</table><div class="muted" style="margin-top:6px">"Text on screen while the song plays" shows under the task during the clip (you type it). Finish the Line: click ▶ Listen next to the song, then click ⏹ Stop here right before the line they should sing. The game remembers that moment by itself (you see it under "Play for"). Click ▶ Test the clip to check it. "Small line under it" can hold the real line if you want it on screen (you type it).</div>
    <div style="margin-top:14px"><button class="ghost" onclick="if(confirm('Put all songs, answers and categories back to the original?')){CFG={};S.set(QK('jcfg'),CFG);drawEdit()}">Reset board to the original</button></div>`;
  $('editIn').innerHTML = h;
  const ds = $('devSel'); if (ds) ds.onchange = () => { SP.device = ds.value; S.set('device', ds.value); };
  const v = $('vol'); if (v) v.onchange = () => { SP.volume = Math.max(5, Math.min(100, Number(v.value) || 80)); S.set('volume', SP.volume); };
}
const MS = {c: null, r: null};
async function listen(c, r) {
  if (!SP.connected()) return toast('Connect Spotify first (top of this page)');
  const t = tc(c, r); MS.c = c; MS.r = r; drawEdit();
  await SP.play(t.song, toMs(t.start), 0);
}
async function markStop(c, r) {
  const t = tc(c, r);
  try {
    const st = await SP.api('/me/player');
    const sec = Math.max(1, Math.round(((st && st.progress_ms || 0) - toMs(t.start)) / 1000 * 2 - 0.6) / 2);
    setTile(c, r, {playFor: String(sec)}); toast('Saved ✓ The music now stops after ' + sec + ' seconds.', 4000);
  } catch (e) { toast('Could not read the song position: ' + e.message); }
  MS.c = MS.r = null; await SP.pause(); drawEdit();
}
async function testClip(c, r) { const t = tc(c, r); if (!SP.connected()) return toast('Connect Spotify first'); toast('Playing the clip… it should stop by itself after ' + t.playFor + ' s', 4000); await SP.play(t.song, toMs(t.start), Number(t.playFor) || 0); }
async function findSong(c, r, q) {
  q = (q || '').trim(); if (!q) return;
  const m = q.match(/track[/:]([A-Za-z0-9]{22})/);
  if (m) { setTile(c, r, {song: 'spotify:track:' + m[1], songName: 'Song from link'}); try { const t = await SP.api('/tracks/' + m[1]); setTile(c, r, {songName: t.name + ' – ' + t.artists.map(a => a.name).join(', ')}); } catch (e) {} return drawEdit(); }
  if (!SP.connected()) return toast('Connect Spotify first (top of this page)');
  try { const items = await SP.search(q); $('res-' + c + '-' + r).innerHTML = items.map(t => `<div onclick="setTile(${c},${r},{song:'${t.uri}',songName:this.textContent});drawEdit()">${esc(t.name)} – ${esc(t.artists.map(a => a.name).join(', '))}</div>`).join('') || '<span class="muted">Nothing found</span>'; }
  catch (e) { toast('Search failed: ' + e.message); }
}
async function autoFill() {
  let n = 0, empty = 0, fail = 0;
  for (let c = 0; c < NC; c++) for (let r = 0; r < NR; r++) { const d = DATA.cats[c].tiles[r]; if (tc(c, r).song) continue; empty++;
    try { const it = await SP.search(d.q); if (it[0]) { setTile(c, r, {song: it[0].uri, songName: it[0].name + ' – ' + it[0].artists.map(a => a.name).join(', ')}); n++; } else fail++; } catch (e) { fail++; } }
  toast(!empty ? 'All squares already have a song ✓' : fail ? n + ' songs added, ' + fail + ' not found. Find those by hand in the list below.' : n + ' songs added ✓ Check them in the list below.', 5000); drawEdit();
}

/* ---------- start ---------- */
(async () => {
  loadCustom(); render();
  ['Lilita One', 'Nunito'].forEach(f => document.fonts && document.fonts.load('20px "' + f + '"').then(render));
})();
</script>
</body>
</html>
